name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool==4.7.0

      - name: Build
        run: pio run

      - name: Merge jadi satu file .bin (flash di 0x0)
        run: |
          B=.pio/build/tdisplay
          python -m esptool --chip esp32 merge_bin -o weather-station-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin weather-station-app.bin
          ls -lh *.bin

      - uses: actions/upload-artifact@v4
        with:
          name: weather-station-tdisplay
          path: |
            weather-station-merged.bin
            weather-station-app.bin

      - name: Release (kalau di-tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            weather-station-merged.bin
            weather-station-app.bin
